<!DOCTYPE html>
<html>
<head><title>Admin – BoxCycle Availability</title><link rel="stylesheet" href="css/style.css"><style>.admin-container{max-width:1200px;margin:2rem auto;padding:2rem;background:#fff;border-radius:32px;}</style></head>
<body>
<div class="admin-container">
    <h1>Admin Panel – Blocked Dates</h1>
    <div id="loginSection">
        <input type="password" id="adminPass" placeholder="Admin password">
        <button onclick="authenticate()">Login</button>
    </div>
    <div id="adminContent" style="display:none;">
        <h2>Add blocked date range</h2>
        <input type="date" id="blockStart"> to <input type="date" id="blockEnd">
        <input type="text" id="blockReason" placeholder="Reason (e.g., Booked by customer)">
        <button onclick="addBlockedRange()">Block</button>
        <h2>Current blocked ranges</h2>
        <ul id="blockedList"></ul>
        <h2>Netlify Form Submissions</h2>
        <button onclick="fetchSubmissions()">Load submissions</button>
        <pre id="submissionsOutput"></pre>
    </div>
</div>
<script>
    let adminToken = '';
    function authenticate() {
        const pwd = document.getElementById('adminPass').value;
        // Simple hardcoded password – replace with env or Netlify Identity
        if(pwd === 'BoxCycleAdmin2026') {
            adminToken = pwd;
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminContent').style.display = 'block';
            loadBlockedRanges();
        } else { alert('Wrong password'); }
    }
    async function loadBlockedRanges() {
        const res = await fetch('/.netlify/functions/blocked-dates');
        const data = await res.json();
        const list = document.getElementById('blockedList');
        list.innerHTML = data.blockedRanges.map(r => `<li>${r.start} → ${r.end} (${r.reason})</li>`).join('');
    }
    async function addBlockedRange() {
        const start = document.getElementById('blockStart').value;
        const end = document.getElementById('blockEnd').value;
        const reason = document.getElementById('blockReason').value;
        if(!start || !end) return alert('Enter dates');
        const res = await fetch('/.netlify/functions/blocked-dates', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-admin-key': adminToken },
            body: JSON.stringify({ start, end, reason })
        });
        if(res.ok) { alert('Blocked added'); loadBlockedRanges(); }
        else alert('Error');
    }
    async function fetchSubmissions() {
        // Requires a separate function that calls Netlify API (needs NETLIFY_API_TOKEN)
        const res = await fetch('/.netlify/functions/get-submissions');
        const data = await res.json();
        document.getElementById('submissionsOutput').innerText = JSON.stringify(data, null, 2);
    }
</script>
</body>
</html>
